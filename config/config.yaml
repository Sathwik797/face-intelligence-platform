# System Configuration for Face Recognition Attendance System

paths:
  dataset_dir: "dataset"
  embeddings_path: "trained_model/face_encodings.pkl"
  attendance_file: "attendance.csv"
  data_dir: "data"
  raw_lfw_dir: "data/raw/lfw"
  evaluation_dir: "data/evaluation"
  metadata_dir: "data/metadata"
  gallery_path: "data/embeddings/arcface_gallery.npz"

dataset:
  name: "LFW"
  random_seed: 42
  min_faces_per_person: 20   # Minimum images required for identity selection
  enrollment_samples: 2      # Number of reference gallery images per enrolled identity
  val_ratio: 0.5             # Ratio of remaining images assigned to validation (remainder to test)

model:
  # Baseline Profile (E1)
  baseline_detector: "dlib_hog"
  baseline_embedder: "dlib_128d"
  baseline_threshold: 0.6    # Euclidean distance threshold

  # Modern Profile (E2)
  modern_detector: "yunet_onnx"
  yunet_model_path: "ml/models/face_detection_yunet_2023mar.onnx"
  score_threshold: 0.6
  nms_threshold: 0.3
  aligned_face_size: [112, 112]
  multi_face_policy: "highest_confidence"  # Options: "highest_confidence" or "reject"
  
  modern_embedder: "arcface_512d"
  arcface_model_path: "ml/models/arcface_w600k_r50.onnx"
  arcface_embedding_dim: 512

quality:
  # Phase 8 Face Quality Assessment (FQA)
  enabled: true
  mode: "balanced"           # Options: "strict", "balanced", "lenient"
  min_face_width: 40
  min_face_height: 40
  min_face_area_ratio: 0.015
  min_blur_score: 40.0       # Minimum Variance of Laplacian
  min_brightness: 35.0
  max_brightness: 225.0
  min_contrast: 18.0
  min_detection_confidence: 0.60
  min_alignment_quality: 0.50
  min_pose_quality: 0.40

temporal:
  # Phase 9 Temporal Recognition & Identity Stability
  enabled: true
  mode: "balanced"           # Options: "fast", "balanced", "stable"
  window_size: 7
  min_observations: 4
  min_stable_ratio: 0.70
  max_unknown_observations: 3
  challenger_switch_threshold: 3
  max_gap_seconds: 2.0

presence:
  # Phase 10 Presence & Session Intelligence
  enabled: true
  mode: "balanced"           # Options: "fast", "balanced", "strict"
  min_entry_observations: 3
  entry_window_seconds: 5.0
  grace_period_seconds: 10.0
  max_session_duration_seconds: 28800.0  # 8 hours safeguard

runtime:
  # Phase 11 System Integration & Runtime Orchestration
  enabled: true
  heartbeat_interval_seconds: 1.0
  auto_tick: true
  max_buffered_history: 100

recognition:
  # Validation-derived production cosine similarity threshold from Phase 7
  similarity_threshold: 0.24

app:
  host: "127.0.0.1"
  port: 5000
  debug: true
